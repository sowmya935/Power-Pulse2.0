
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Power Pulse</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 4px 10px #00000015;
        }

        h1 {
            color: #1e3a8a;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
        }

        button {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        a {
            color: #2563eb;
        }
    
        .flash { padding: 10px 14px; border-radius: 6px; margin: 10px 0; font-size: 14px; }
        .flash.error { background: #fee2e2; color: #991b1b; }
        .flash.success { background: #dcfce7; color: #166534; }
    </style>
</head>

<body>

    <div class="container">

        <h1>⚡ Power Pulse</h1>

        <h2>Create Account</h2>
        <div class="flash error" th:if="${error}" th:text="${error}"></div>
        <div class="flash success" th:if="${message}" th:text="${message}"></div>

        <form method="post" th:action="@{/register}">

            <label>Name:</label>
            <br>

            <input
                type="text"
                name="name"
                th:value="${name}"
                placeholder="Enter your name"
                required
            >

            <br>

            <label>Email:</label>
            <br>

            <input
                type="email"
                name="email"
                th:value="${email}"
                placeholder="Enter your email"
                required
            >

            <br>

            <label>Password:</label>
            <br>

            <input
                type="password"
                name="password"
                placeholder="Min 6 characters"
                minlength="6"
                required
            >

            <br><br>

            <button type="submit">
                Register
            </button>

        </form>

        <p>
            Already have an account?
            <a th:href="@{/login}">Login</a>
        </p>

    </div>

</body>

</html>
